<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>پنل فروش MHR</title><style> :root{ --bg:#0f172a;--bg-soft:#1e293b;--card:#1e293b;--card-2:#273449;--border:#334155; --text:#e2e8f0;--dim:#94a3b8;--primary:#3b82f6;--primary-dark:#2563eb; --accent:#06b6d4;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--radius:14px; } @font-face{font-family:'Vazirmatn';src:url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:normal} @font-face{font-family:'Vazirmatn';src:url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:bold} *{box-sizing:border-box;margin:0;padding:0} html,body{height:100%} body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;background:linear-gradient(160deg,#0f172a 0%,#0b1220 100%);color:var(--text);direction:rtl;line-height:1.7;min-height:100vh} .topbar{background:rgba(15,23,42,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50} .brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:18px} .brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-size:18px} .topbar .actions{display:flex;gap:8px;align-items:center} .user-chip{font-size:13px;color:var(--dim);margin-left:6px} .wrap{max-width:980px;margin:0 auto;padding:22px 16px 70px} .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:18px} .card h2{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px} .field{margin-bottom:14px} label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px} input,textarea,select{width:100%;padding:12px 14px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;transition:border .15s} input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)} textarea{resize:vertical;min-height:90px} input[type=file]{padding:9px} .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-family:inherit;font-weight:bold;color:#fff;background:var(--primary);transition:transform .08s,opacity .15s,background .15s} .btn:hover{background:var(--primary-dark)} .btn:active{transform:scale(.98)} .btn:disabled{opacity:.5;cursor:not-allowed} .btn.block{width:100%} .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)} .btn.ghost:hover{background:var(--card-2)} .btn.green{background:var(--green)}.btn.green:hover{background:#16a34a} .btn.red{background:var(--red)}.btn.red:hover{background:#dc2626} .btn.amber{background:var(--amber)} .btn.sm{padding:8px 12px;font-size:13px} .btn-row{display:flex;gap:10px;flex-wrap:wrap} .alert{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px} .alert.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5} .alert.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac} .alert.info{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4);color:#93c5fd} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px} .plan{background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;transition:transform .12s,border .15s} .plan:hover{transform:translateY(-3px);border-color:var(--primary)} .plan .name{font-size:17px;font-weight:bold;margin-bottom:6px} .plan .price{font-size:24px;font-weight:bold;color:var(--accent);margin:8px 0} .plan .price small{font-size:12px;color:var(--dim)} .plan .desc{font-size:13px;color:var(--dim);margin-bottom:14px;min-height:34px} .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px} .stat{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center} .stat .num{font-size:26px;font-weight:bold;color:var(--accent)} .stat .lbl{font-size:12px;color:var(--dim);margin-top:4px} .order{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px} .order .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px} .order .meta{font-size:13px;color:var(--dim)} .order .amount{font-weight:bold;font-size:16px} .badge{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:bold;white-space:nowrap} .st-pending_payment{background:rgba(148,163,184,.18);color:#cbd5e1} .st-pending_review{background:rgba(245,158,11,.18);color:#fcd34d} .st-approved{background:rgba(34,197,94,.18);color:#86efac} .st-rejected{background:rgba(239,68,68,.18);color:#fca5a5} .config-box{background:#0b1220;border:1px dashed var(--primary);border-radius:10px;padding:12px;word-break:break-all;font-family:'Courier New',monospace;font-size:13px;margin:10px 0;max-height:140px;overflow:auto;direction:ltr;text-align:left} .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px} .kv:last-child{border-bottom:none} .kv span:first-child{color:var(--dim)} .receipt-thumb{max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--border)} .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px} .tab{padding:8px 14px;border-radius:20px;background:var(--bg-soft);border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--dim)} .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)} .center{text-align:center}.muted{color:var(--dim);font-size:13px}.hidden{display:none!important} .auth-card{max-width:420px;margin:30px auto} .seg{display:flex;background:var(--bg-soft);border-radius:10px;padding:4px;margin-bottom:18px} .seg button{flex:1;padding:10px;border:none;background:transparent;color:var(--dim);cursor:pointer;border-radius:8px;font-family:inherit;font-weight:bold;font-size:14px} .seg button.active{background:var(--primary);color:#fff} .nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px} .nav .tab{flex:1;text-align:center;min-width:90px} .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px} .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;max-width:500px;width:100%;max-height:90vh;overflow:auto} .foot{text-align:center;color:var(--dim);font-size:12px;padding:20px} .copy-card{background:#0b1220;border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;margin:12px 0} .copy-card .cn{font-size:22px;font-weight:bold;letter-spacing:2px;direction:ltr;color:var(--accent)} .hero{text-align:center;padding:10px 0 20px} .hero .big{font-size:26px;font-weight:bold;margin-bottom:6px} @media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.nav .tab{min-width:auto}}
</style></head><body><div id="app"></div><script>
/* ============================================================ MHR پنل فروش — اپلیکیشن آنلاین کامل (نسخه مستقل / Demo) دیتابیس: حافظه مرورگر (localStorage) برای استفاده واقعی چندکاربره باید به بک‌اند وصل بشه. ============================================================ */ const LS_KEY='mhr_panel_db_v1'; /* ---------- دیتابیس ---------- */
function loadDB(){ let raw=localStorage.getItem(LS_KEY); if(raw){try{return JSON.parse(raw)}catch(e){}} // مقدار پیش‌فرض const db={ users:[], session:null, plans:[ {id:'p1',name:'یک ماهه',price:50000,days:30,desc:'اشتراک یک ماهه کامل',active:true,sort:1}, {id:'p2',name:'سه ماهه',price:130000,days:90,desc:'۱۳٪ تخفیف',active:true,sort:2}, {id:'p3',name:'شش ماهه',price:240000,days:180,desc:'۲۰٪ تخفیف',active:true,sort:3}, {id:'p4',name:'یک ساله',price:450000,days:365,desc:'۲۵٪ تخفیف',active:true,sort:4} ], orders:[], settings:{ siteName:'پنل فروش MHR', welcome:'به پنل فروش خوش آمدید. برای خرید اشتراک، ثبت‌نام کنید یا وارد شوید.', cardNumber:'6037-XXXX-XXXX-XXXX', cardHolder:'نام صاحب حساب', bank:'بانک', support:'@username', adminPassword:'admin123' } }; saveDB(db);return db;
}
function saveDB(db){localStorage.setItem(LS_KEY,JSON.stringify(db))}
let DB=loadDB(); /* ---------- ابزار ---------- */
const $=s=>document.querySelector(s);
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmtNum(n){return Number(n).toLocaleString('fa-IR')}
function toman(n){return fmtNum(n)+' تومان'}
function nowStr(){const d=new Date();const p=n=>('0'+n).slice(-2);return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function statusText(s){return {pending_payment:'در انتظار پرداخت',pending_review:'در انتظار تأیید',approved:'فعال / تحویل شده',rejected:'رد شده'}[s]||s}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))} /* ---------- رندر اصلی ---------- */
function render(){ const app=$('#app'); const s=DB.session; let topbar; if(s&&s.role==='admin'){ topbar=adminTopbar(); }else if(s&&s.role==='user'){ topbar=userTopbar(); }else{ topbar=guestTopbar(); } let body; if(s&&s.role==='admin') body=adminBody(); else if(s&&s.role==='user') body=userBody(); else body=guestBody(); app.innerHTML=topbar+'<div class="wrap">'+body+'</div><div class="foot">© '+new Date().getFullYear()+' پنل فروش MHR</div>'; bindEvents();
} /* ---------- نوار بالا ---------- */
function guestTopbar(){ return `<div class="topbar"><div class="brand"><div class="logo">🛡️</div><span>${esc(DB.settings.siteName)}</span></div><div class="actions"><button class="btn ghost sm" onclick="goAdminLogin()">ورود ادمین</button></div></div>`;
}
function userTopbar(){ return `<div class="topbar"><div class="brand"><div class="logo">🛡️</div><span>${esc(DB.settings.siteName)}</span></div><div class="actions"><span class="user-chip">👤 ${esc(DB.session.name)}</span><button class="btn ghost sm" onclick="logout()">خروج</button></div></div>`;
}
function adminTopbar(){ return `<div class="topbar"><div class="brand"><div class="logo">⚙️</div><span>پنل مدیریت</span></div><div class="actions"><span class="user-chip">🔑 ادمین</span><button class="btn ghost sm" onclick="logout()">خروج</button></div></div>`;
} /* ---------- بدنه مهمان (لاگین/ثبت‌نام) ---------- */
let authMode='login';
function guestBody(){ return `<div class="auth-card card"><div class="seg"><button id="segLogin" onclick="setAuth('login')">ورود</button><button id="segReg" onclick="setAuth('register')">ثبت‌نام</button></div><div id="authAlert"></div><div id="authForm"></div><div class="center muted" style="margin-top:14px">پشتیبانی: ${esc(DB.settings.support)}</div></div>`;
}
function setAuth(m){authMode=m;renderAuthForm()}
function renderAuthForm(){ const login=authMode==='login'; $('#segLogin').classList.toggle('active',login); $('#segReg').classList.toggle('active',!login); $('#authForm').innerHTML=login?` <div class="field"><label>شماره موبایل</label><input id="lPhone" placeholder="۰۹xxxxxxxxx"></div><div class="field"><label>رمز عبور</label><input id="lPass" type="password" placeholder="رمز عبور"></div><button class="btn block" onclick="doLogin()">ورود</button> `:` <div class="field"><label>نام و نام خانوادگی</label><input id="rName" placeholder="نام شما"></div><div class="field"><label>شماره موبایل</label><input id="rPhone" placeholder="۰۹xxxxxxxxx"></div><div class="field"><label>رمز عبور</label><input id="rPass" type="password" placeholder="حداقل ۶ کاراکتر"></div><button class="btn block" onclick="doRegister()">ثبت‌نام</button> `;
}
function authAlert(type,msg){$('#authAlert').innerHTML=`<div class="alert ${type}">${msg}</div>`}
function doRegister(){ const name=$('#rName').value.trim(),phone=$('#rPhone').value.trim(),pass=$('#rPass').value; if(!name||!phone||!pass)return authAlert('err','همه فیلدها را پر کنید.'); if(pass.length<6)return authAlert('err','رمز عبور حداقل ۶ کاراکتر باشد.'); if(DB.users.find(u=>u.phone===phone))return authAlert('err','این شماره قبلاً ثبت شده. وارد شوید.'); const u={id:uid('user'),name,phone,password:pass}; DB.users.push(u);DB.session={token:uid('t'),userId:u.id,role:'user',name:u.name};saveDB(DB); DB.currentView='plans';render();
}
function doLogin(){ const phone=$('#lPhone').value.trim(),pass=$('#lPass').value; if(!phone||!pass)return authAlert('err','شماره و رمز را وارد کنید.'); const u=DB.users.find(x=>x.phone===phone&&x.password===pass); if(!u)return authAlert('err','شماره یا رمز اشتباه است.'); DB.session={token:uid('t'),userId:u.id,role:'user',name:u.name};saveDB(DB); DB.currentView='plans';render();
} /* ورود ادمین */
function goAdminLogin(){DB.adminView=true;renderAdminLogin()}
function renderAdminLogin(){ $('#app').innerHTML=`<div class="topbar"><div class="brand"><div class="logo">⚙️</div><span>پنل مدیریت</span></div><div class="actions"><button class="btn ghost sm" onclick="DB.adminView=false;render()">بازگشت</button></div></div><div class="wrap"><div class="auth-card card"><h2>🔐 ورود به پنل مدیریت</h2><div id="admAlert"></div><div class="field"><label>رمز عبور ادمین</label><input id="admPass" type="password" placeholder="رمز ادمین"></div><button class="btn block" onclick="doAdminLogin()">ورود</button><div class="center muted" style="margin-top:12px">رمز پیش‌فرض: admin123 (از تنظیمات تغییر بدید)</div></div></div>`;
}
function admAlert(t,m){$('#admAlert').innerHTML=`<div class="alert ${t}">${m}</div>`}
function doAdminLogin(){ const pass=$('#admPass').value; if(pass!==DB.settings.adminPassword)return admAlert('err','رمز اشتباه است.'); DB.session={token:uid('t'),role:'admin'};DB.adminView=false;saveDB(DB); DB.adminCurrent='dashboard';render();
} /* ---------- بدنه مشتری ---------- */
function userBody(){ DB.currentView=DB.currentView||'plans'; const nav=`<div class="nav"><div class="tab ${DB.currentView==='plans'?'active':''}" onclick="DB.currentView='plans';render()">🛒 خرید اشتراک</div><div class="tab ${DB.currentView==='orders'?'active':''}" onclick="DB.currentView='orders';render()">📋 سفارش‌های من</div><div class="tab ${DB.currentView==='support'?'active':''}" onclick="DB.currentView='support';render()">💬 پشتیبانی</div></div>`; let content; if(DB.currentView==='plans')content=plansView(); else if(DB.currentView==='orders')content=myOrdersView(); else content=supportView(); return nav+content;
}
function plansView(){ const plans=[...DB.plans].filter(p=>p.active).sort((a,b)=>a.sort-b.sort); return `<div class="hero"><div class="big">🛒 انتخاب اشتراک</div><div class="muted">${esc(DB.settings.welcome)}</div></div><div class="grid">${plans.map(p=>` <div class="plan ${p.sort===2?'':''}"><div class="name">${esc(p.name)}</div><div class="price">${fmtNum(p.price)} <small>تومان</small></div><div class="desc">${esc(p.desc)}</div><button class="btn block" onclick="orderPlan('${p.id}')">سفارش</button></div>`).join('')}</div>`;
}
function orderPlan(id){ const p=DB.plans.find(x=>x.id===id);if(!p)return; const o={id:uid('order'),userId:DB.session.userId,userName:DB.users.find(u=>u.id===DB.session.userId)?.name||'',userPhone:DB.users.find(u=>u.id===DB.session.userId)?.phone||'',planId:p.id,planName:p.name,amount:p.price,days:p.days,status:'pending_payment',receipt:'',config:'',createdAt:nowStr(),reviewedAt:'',note:''}; DB.orders.push(o);saveDB(DB); DB.currentView='orders'; DB.payOrderId=o.id; render();
}
function myOrdersView(){ const mine=DB.orders.filter(o=>o.userId===DB.session.userId).sort((a,b)=>b.createdAt>a.createdAt?1:-1); if(DB.payOrderId&&mine.find(o=>o.id===DB.payOrderId&&o.status==='pending_payment')){ const o=mine.find(x=>x.id===DB.payOrderId); return payView(o); } if(!mine.length)return `<div class="card center"><h2>📋 سفارش‌های من</h2><div class="muted" style="padding:20px">هنوز سفارشی ندارید.<br>برای شروع به بخش «خرید اشتراک» بروید.</div><button class="btn" onclick="DB.currentView='plans';render()">خرید اشتراک</button></div>`; return `<div class="card"><h2>📋 سفارش‌های من</h2>${mine.map(orderCard).join('')}</div>`;
}
function orderCard(o){ const cfg=o.config&&o.status==='approved'?`<div class="kv"><span>🔗 کانفیگ شما</span></div><div class="config-box">${esc(o.config)}</div><button class="btn ghost sm" onclick="copyText(${JSON.stringify(o.config)})">📋 کپی کانفیگ</button>`:''; const payBtn=o.status==='pending_payment'?`<button class="btn amber sm" onclick="DB.payOrderId='${o.id}';DB.currentView='orders';render()">ارسال رسید</button>`:''; const note=o.note?`<div class="alert info" style="margin:8px 0">${esc(o.note)}</div>`:''; return `<div class="order"><div class="top"><div><div class="amount">${esc(o.planName)}</div><div class="meta">${toman(o.amount)} • ${o.createdAt}</div></div><span class="badge st-${o.status}">${statusText(o.status)}</span></div> ${note}${cfg}<div class="btn-row" style="margin-top:8px">${payBtn}</div></div>`;
}
function payView(o){ return `<div class="card"><h2>💳 پرداخت سفارش — ${esc(o.planName)}</h2><div class="alert info">مبلغ قابل پرداخت: <b>${toman(o.amount)}</b></div><div class="copy-card"><div class="muted">شماره کارت</div><div class="cn">${esc(DB.settings.cardNumber)}</div><div class="muted">${esc(DB.settings.cardHolder)} • ${esc(DB.settings.bank)}</div><button class="btn ghost sm" onclick="copyText(${JSON.stringify(DB.settings.cardNumber)})" style="margin-top:8px">📋 کپی شماره کارت</button></div><div class="alert info">۱) مبلغ را به کارت بالا واریز کنید.<br>۲) عکس رسید پرداخت را آپلود کنید.<br>۳) پس از تأیید ادمین، کانفیگ شما فعال می‌شود.</div><div class="field"><label>آپلود عکس رسید</label><input type="file" id="receiptFile" accept="image/*"></div><div id="payAlert"></div><div class="btn-row"><button class="btn green" onclick="submitReceipt('${o.id}')">ارسال رسید</button><button class="btn ghost" onclick="DB.payOrderId=null;DB.currentView='orders';render()">انصراف</button></div></div>`;
}
function payAlert(t,m){$('#payAlert').innerHTML=`<div class="alert ${t}">${m}</div>`}
function submitReceipt(id){ const f=$('#receiptFile').files[0]; if(!f)return payAlert('err','لطفاً عکس رسید را انتخاب کنید.'); const reader=new FileReader(); reader.onload=()=>{ const o=DB.orders.find(x=>x.id===id); o.receipt=reader.result;o.status='pending_review';saveDB(DB); DB.payOrderId=null;DB.currentView='orders';render(); }; reader.readAsDataURL(f);
}
function supportView(){ return `<div class="card"><h2>💬 پشتیبانی</h2><div class="kv"><span>راه ارتباطی</span><span>${esc(DB.settings.support)}</span></div><div class="alert info">برای هرگونه سؤال یا مشکل از طریق راه ارتباطی بالا در تماس باشید.</div></div>`;
} /* ---------- بدنه ادمین ---------- */
function adminBody(){ DB.adminCurrent=DB.adminCurrent||'dashboard'; const nav=`<div class="nav"><div class="tab ${DB.adminCurrent==='dashboard'?'active':''}" onclick="DB.adminCurrent='dashboard';render()">📊 داشبورد</div><div class="tab ${DB.adminCurrent==='orders'?'active':''}" onclick="DB.adminCurrent='orders';render()">🧾 سفارش‌ها</div><div class="tab ${DB.adminCurrent==='plans'?'active':''}" onclick="DB.adminCurrent='plans';render()">📦 پلن‌ها</div><div class="tab ${DB.adminCurrent==='settings'?'active':''}" onclick="DB.adminCurrent='settings';render()">⚙️ تنظیمات</div></div>`; let c; if(DB.adminCurrent==='dashboard')c=adminDashboard(); else if(DB.adminCurrent==='orders')c=adminOrders(); else if(DB.adminCurrent==='plans')c=adminPlans(); else c=adminSettings(); return nav+c;
}
function adminDashboard(){ const o=DB.orders; const rev=o.filter(x=>x.status==='approved').reduce((s,x)=>s+x.amount,0); const stats=[ {n:o.length,l:'کل سفارش‌ها'},{n:o.filter(x=>x.status==='pending_review').length,l:'در انتظار تأیید'}, {n:o.filter(x=>x.status==='approved').length,l:'فعال'},{n:DB.users.length,l:'کاربران'},{n:rev,l:'درآمد (تومان)'} ]; return `<div class="card"><h2>📊 داشبورد</h2><div class="stats">${stats.map(s=>`<div class="stat"><div class="num">${typeof s.n==='number'&&s.l.includes('درآمد')?fmtNum(s.n):s.n}</div><div class="lbl">${s.l}</div></div>`).join('')}</div><div style="margin-top:14px"><button class="btn" onclick="DB.adminCurrent='orders';render()">مشاهده سفارش‌های در انتظار</button></div></div>`;
}
let adminFilter='pending_review';
function adminOrders(){ const all=DB.orders.sort((a,b)=>b.createdAt>a.createdAt?1:-1); const list=adminFilter==='all'?all:all.filter(o=>o.status===adminFilter); const filters=[['all','همه'],['pending_payment','در انتظار پرداخت'],['pending_review','در انتظار تأیید'],['approved','فعال'],['rejected','رد شده']]; return `<div class="card"><h2>🧾 مدیریت سفارش‌ها</h2><div class="tabs">${filters.map(f=>`<div class="tab ${adminFilter===f[0]?'active':''}" onclick="adminFilter='${f[0]}';render()">${f[1]} (${f[0]==='all'?all.length:all.filter(o=>o.status===f[0]).length})</div>`).join('')}</div> ${list.length?list.map(adminOrderCard).join(''):'<div class="muted center" style="padding:20px">سفارشی نیست.</div>'} </div>`;
}
function adminOrderCard(o){ const receipt=o.receipt?`<img src="${o.receipt}" class="receipt-thumb" onclick="window.open('${o.receipt}')">`:'<div class="muted">رسید آپلود نشده</div>'; let actions=''; if(o.status==='pending_review'){ actions=`<button class="btn green sm" onclick="openDeliver('${o.id}')">✅ تأیید و تحویل کانفیگ</button><button class="btn red sm" onclick="openReject('${o.id}')">❌ رد</button>`; } if(o.status==='pending_payment'){ actions=`<span class="muted">منتظر آپلود رسید توسط مشتری...</span>`; } const cfg=o.config?`<div class="config-box">${esc(o.config)}</div>`:''; const note=o.note?`<div class="alert info">دلیل رد: ${esc(o.note)}</div>`:''; return `<div class="order"><div class="top"><div><div class="amount">${esc(o.planName)} — ${toman(o.amount)}</div><div class="meta">👤 ${esc(o.userName)} • 📱 ${esc(o.userPhone)}<br>⏱ ${o.createdAt}</div></div><span class="badge st-${o.status}">${statusText(o.status)}</span></div> ${note}<div class="kv"><span>رسید پرداخت</span></div>${receipt}${cfg} <div class="btn-row" style="margin-top:10px">${actions}</div></div>`;
}
/* مودال تحویل کانفیگ */
function openDeliver(id){ const m=`<div class="modal-bg" id="mod" onclick="if(event.target.id==='mod')closeModal()"><div class="modal"><h2>✅ تأیید و تحویل کانفیگ</h2><div class="field"><label>متن / لینک کانفیگ (به مشتری نمایش داده می‌شود)</label><textarea id="cfgText" placeholder="لینک یا متن کانفیگ mhr را اینجا بگذارید..."></textarea></div><div id="modAlert"></div><div class="btn-row"><button class="btn green" onclick="doDeliver('${id}')">تأیید و ارسال</button><button class="btn ghost" onclick="closeModal()">انصراف</button></div></div></div>`; openModal(m);
}
function doDeliver(id){ const t=$('#cfgText').value.trim(); if(!t){$('#modAlert').innerHTML='<div class="alert err">متن کانفیگ را وارد کنید.</div>';return;} const o=DB.orders.find(x=>x.id===id);o.config=t;o.status='approved';o.reviewedAt=nowStr();saveDB(DB); closeModal();render();
}
function openReject(id){ const m=`<div class="modal-bg" id="mod" onclick="if(event.target.id==='mod')closeModal()"><div class="modal"><h2>❌ رد سفارش</h2><div class="field"><label>دلیل رد (اختیاری)</label><textarea id="rejNote" placeholder="مثلاً: مبلغ ناقص واریز شده"></textarea></div><div class="btn-row"><button class="btn red" onclick="doReject('${id}')">رد سفارش</button><button class="btn ghost" onclick="closeModal()">انصراف</button></div></div></div>`; openModal(m);
}
function doReject(id){ const o=DB.orders.find(x=>x.id===id);o.status='rejected';o.note=$('#rejNote').value.trim();o.reviewedAt=nowStr();saveDB(DB); closeModal();render();
}
function openModal(html){const d=document.createElement('div');d.innerHTML=html;document.body.appendChild(d.firstElementChild)}
function closeModal(){const m=$('#mod');if(m)m.remove()} /* مدیریت پلن‌ها */
function adminPlans(){ return `<div class="card"><h2>📦 مدیریت پلن‌ها</h2><button class="btn sm" onclick="openPlanForm()">➕ افزودن پلن</button><div style="margin-top:14px">${DB.plans.sort((a,b)=>a.sort-b.sort).map(p=>` <div class="order"><div class="top"><div><div class="amount">${esc(p.name)}</div><div class="meta">${toman(p.price)} • ${p.days} روز • ${p.active?'فعال':'غیرفعال'}</div></div><div class="btn-row"><button class="btn ghost sm" onclick="openPlanForm('${p.id}')">ویرایش</button><button class="btn red sm" onclick="delPlan('${p.id}')">حذف</button></div></div></div>`).join('')}</div></div>`;
}
function openPlanForm(id){ const p=id?DB.plans.find(x=>x.id===id):{name:'',price:'',days:'',desc:'',active:true,sort:99}; const m=`<div class="modal-bg" id="mod" onclick="if(event.target.id==='mod')closeModal()"><div class="modal"><h2>${id?'ویرایش پلن':'پلن جدید'}</h2><div class="field"><label>نام پلن</label><input id="pfName" value="${esc(p.name)}"></div><div class="field"><label>قیمت (تومان)</label><input id="pfPrice" type="number" value="${p.price}"></div><div class="field"><label>مدت (روز)</label><input id="pfDays" type="number" value="${p.days}"></div><div class="field"><label>توضیحات</label><input id="pfDesc" value="${esc(p.desc)}"></div><div class="field"><label>ترتیب نمایش</label><input id="pfSort" type="number" value="${p.sort}"></div><div class="field"><label><input type="checkbox" id="pfActive" ${p.active?'checked':''} style="width:auto"> فعال</label></div><div class="btn-row"><button class="btn" onclick="savePlan('${id||''}')">ذخیره</button><button class="btn ghost" onclick="closeModal()">انصراف</button></div></div></div>`; openModal(m);
}
function savePlan(id){ const data={name:$('#pfName').value.trim(),price:Number($('#pfPrice').value)||0,days:Number($('#pfDays').value)||0,desc:$('#pfDesc').value.trim(),sort:Number($('#pfSort').value)||99,active:$('#pfActive').checked}; if(!data.name){alert('نام پلن الزامی است.');return;} if(id){const p=DB.plans.find(x=>x.id===id);Object.assign(p,data)} else{DB.plans.push(Object.assign({id:uid('plan')},data))} saveDB(DB);closeModal();render();
}
function delPlan(id){if(confirm('پلن حذف شود؟')){DB.plans=DB.plans.filter(p=>p.id!==id);saveDB(DB);render()}} /* تنظیمات */
function adminSettings(){ const s=DB.settings; return `<div class="card"><h2>⚙️ تنظیمات</h2><div class="field"><label>نام سایت</label><input id="sName" value="${esc(s.siteName)}"></div><div class="field"><label>متن خوش‌آمدگویی</label><textarea id="sWelcome">${esc(s.welcome)}</textarea></div><h3>💳 اطلاعات کارت</h3><div class="field"><label>شماره کارت</label><input id="sCard" value="${esc(s.cardNumber)}"></div><div class="field"><label>صاحب حساب</label><input id="sHolder" value="${esc(s.cardHolder)}"></div><div class="field"><label>نام بانک</label><input id="sBank" value="${esc(s.bank)}"></div><h3>💬 پشتیبانی</h3><div class="field"><label>راه ارتباطی</label><input id="sSupport" value="${esc(s.support)}"></div><h3>🔐 رمز ادمین</h3><div class="field"><label>رمز ادمین جدید (اختیاری)</label><input id="sPass" type="password" placeholder="خالی بگذارید تا تغییر نکند"></div><div id="setAlert"></div><button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button></div>`;
}
function saveSettings(){ DB.settings.siteName=$('#sName').value.trim(); DB.settings.welcome=$('#sWelcome').value.trim(); DB.settings.cardNumber=$('#sCard').value.trim(); DB.settings.cardHolder=$('#sHolder').value.trim(); DB.settings.bank=$('#sBank').value.trim(); DB.settings.support=$('#sSupport').value.trim(); const np=$('#sPass').value; if(np){if(np.length<6){$('#setAlert').innerHTML='<div class="alert err">رمز ادمین حداقل ۶ کاراکتر باشد.</div>';return;}DB.settings.adminPassword=np} saveDB(DB);$('#setAlert').innerHTML='<div class="alert ok">تنظیمات ذخیره شد.</div>'; setTimeout(render,800);
} /* ---------- عمومی ---------- */
function logout(){DB.session=null;DB.currentView='plans';DB.adminCurrent='dashboard';saveDB(DB);render()}
function copyText(t){navigator.clipboard.writeText(t).then(()=>{toast('کپی شد ✓')}).catch(()=>toast('کپی نشد'))}
let toastT;
function toast(msg){ let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:10px 20px;border-radius:10px;z-index:999;font-family:inherit;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,.4)';document.body.appendChild(el)} el.textContent=msg;el.style.opacity='1'; clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity='0',1800);
}
function bindEvents(){if(!DB.session&&$('#authForm'))renderAuthForm()} /* ---------- شروع ---------- */
